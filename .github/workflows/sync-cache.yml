name: Sync Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
  push:
    branches:
      - main
    paths:
      - config.json
      - scripts/sync-cache.mjs
      - scripts/setup-libs.mjs
      - .github/workflows/sync-cache.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download client libraries (skipped if already present)
        run: node scripts/setup-libs.mjs

      - name: Sync cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-cache.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/ lib/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: sync cache"
          git push
